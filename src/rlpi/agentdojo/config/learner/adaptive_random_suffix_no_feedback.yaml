# @package _global_
learner:
  type: adaptive_random_suffix

  # ============================================================================
  # Model Configuration
  # ============================================================================
  attack_model_name: "Qwen/Qwen2-1.5B"  # Attack model tokenizer (generates adversarial suffixes)
  device: "cpu"  # No GPU needed for random generation
  seed: 42
  feedback_fallback_model: "gpt-4o-mini-2024-07-18"  # Used if victim model cannot return logprobs

  # NOTE: The following are auto-set by learner_factory (do not override):
  #   - victim_model_name: Display name extracted from MODEL_NAMES[cfg.model] (e.g., "GPT-4")
  #   - user_name: Extracted from suite environment
  #   - feedback_model: Set to cfg.model for GPT feedback (e.g., "gpt-4o-2024-08-06")

  # ============================================================================
  # Generation Parameters
  # ============================================================================
  max_suffix_length: 20  # Maximum tokens per suffix (match TRL suffix nominal)
  min_suffix_length: 5   # Minimum tokens per suffix
  mutation_rate: 0.5     # Fraction of tokens to mutate when using self-transfer

  # ============================================================================
  # Self-Transfer Parameters
  # ============================================================================
  use_self_transfer: true  # Enable self-transfer (reuse best suffixes)

  # ============================================================================
  # GPT Feedback Configuration - DISABLED
  # ============================================================================
  # This variant uses only security and utility scores, not GPT feedback
  gpt_enabled: false  # Disable GPT-based suffix quality feedback

  # Feedback regime thresholds (not used when gpt_enabled=false, but kept for compatibility)
  gpt_sparse_threshold: 0.1   # Below this: sparse feedback regime
  gpt_medium_threshold: 0.3   # Sparse to medium transition
  gpt_dense_threshold: 0.5    # Medium to dense transition

  # Feedback regime weights (not used when gpt_enabled=false, but kept for compatibility)
  gpt_sparse_weight: 0.8      # High weight in sparse regime (rely on GPT)
  gpt_medium_weight: 0.5      # Medium weight during transition
  gpt_transition_weight: 0.3  # Weight during regime transitions
  gpt_dense_weight: 0.1       # Low weight in dense regime (rely on task success)

  # ============================================================================
  # Logging
  # ============================================================================
  verbose: true  # Enable detailed logging
  save_outputs: true  # Save experience history, suffix history, etc.
  # log_dir: Auto-set to Hydra output directory
